# This file owns the planner's functional parameters.
# The launch file configures use_sim_time separately.

/**/cargo_planner:
  ros__parameters:

    # Grid cells with value >= this are treated as occupied.
    # Free cells = 0, occupied cells = 100.
    occupied_threshold: 65

    # Safety clearance [m] added around every obstacle before pallet placement.
    # Implemented as a pre-erosion of the free-space image with a square kernel
    # of size 2*ceil(pallet_margin/resolution)+1.
    # Set to 0.0 to disable.
    pallet_margin: 0.05

    # If true, each cargo unit is tested in its natural orientation and at
    # 90 degrees yaw.
    # If false, only the natural orientation (0 degrees) is considered.
    enable_rotation: true
